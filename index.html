<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亲戚怎么叫 · 关系计算器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#233e34;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:660px;margin:64px auto;padding:24px}.tag{font-size:12px;letter-spacing:3px;color:#708579}h1{font-size:40px;letter-spacing:-2px;margin:14px 0}header p{color:#7b837c;line-height:1.8}.card{background:white;border:1px solid #e3e8de;border-radius:24px;padding:28px;margin-top:28px;box-shadow:0 16px 50px #263b3108}.gender{display:flex;align-items:center;gap:12px;font-size:14px}select{padding:8px;border:1px solid #dbe3d9;border-radius:8px;background:white;color:#233e34}.path{min-height:64px;margin-top:24px;color:#718176;font-size:15px;line-height:1.8;overflow-wrap:anywhere}.result{background:#eef4e9;border-radius:16px;padding:24px;margin-bottom:24px}.result span{font-size:12px;color:#6c806b}.result h2{margin:10px 0 0;font-size:30px;line-height:1.5}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{font:inherit;cursor:pointer;border:1px solid #e0e6dc;border-radius:12px;padding:15px 6px;background:#fff;color:#304c3c;transition:background .15s,transform .15s}button:hover{background:#edf3e8;transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:3px solid #89ad69;outline-offset:3px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;background:#f5f6f2}.actions button:last-child{background:#284d3b;color:white;border-color:#284d3b}.examples{margin-top:24px;font-size:13px;color:#798477}.examples button{font-size:12px;padding:8px 12px;margin:8px 6px 0 0;border-radius:30px}footer{font-size:12px;color:#899087;text-align:center;margin:24px 0;line-height:1.8}@media(max-width:480px){main{margin:20px auto;padding:18px}h1{font-size:34px}.card{padding:20px}.keys{gap:8px}}
</style></head>
<body><main><header><div class="tag">FAMILY CONNECTIONS</div><h1>亲戚，到底怎么叫？</h1><p>过年见面不尴尬。从自己出发，一步步找到正确称呼。</p></header>
<section class="card" aria-label="亲戚关系计算器"><div class="gender"><label for="gender">我的性别</label><select id="gender"><option value="m">男</option><option value="f">女</option></select></div><div id="path" class="path"></div><div class="result" aria-live="polite"><span>你可以这样称呼 TA</span><h2 id="result">自己</h2></div><div class="keys" id="keys"></div><div class="actions"><button id="back">← 退一步</button><button id="reset">重新开始</button></div><div class="examples">试试看<br><button data-example="f,lb,w">爸爸的弟弟的妻子</button><button data-example="m,os,s">妈妈的姐姐的儿子</button></div></section><footer>采用常见普通话称谓 · 各地习惯可能不同<br>默认同父同母及常见婚姻关系；暂不覆盖所有复杂亲缘关系。</footer></main><script type="module" src="./app.js"></script></body></html>
